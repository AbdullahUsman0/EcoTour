<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EcoTour AI Pakistan</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">EcoTour AI</div>
      <nav class="tabs">
        <button class="tab-btn active" data-tab="planner">Trip Planner</button>
        <button class="tab-btn" data-tab="chat">AI Assistant</button>
        <button class="tab-btn" data-tab="saved">Saved Plans</button>
        <button class="tab-btn" data-tab="crisis">Crisis Help</button>
      </nav>
    </header>

    <main class="container">
      <section class="page active" id="page-planner">
        <div class="card">
          <h2>AI Trip Planner</h2>
          <div class="grid">
            <label>Your Name <input id="travelerName" value="Guest Traveler" /></label>
            <label>Origin <input id="origin" value="Islamabad" /></label>
            <label>Destination <input id="destination" value="Skardu" /></label>
            <label>Travelers <input id="travelers" type="number" min="1" max="20" value="2" /></label>
            <label>Hotel Type
              <select id="hotelTier">
                <option value="budget">Budget</option>
                <option value="midrange" selected>Midrange</option>
                <option value="premium">Premium</option>
              </select>
            </label>
            <label>Transport
              <select id="transportMode">
                <option value="public">Public</option>
                <option value="mixed" selected>Mixed</option>
                <option value="private">Private</option>
              </select>
            </label>
            <label>Activity Pace
              <select id="activityPace">
                <option value="relaxed">Relaxed</option>
                <option value="balanced" selected>Balanced</option>
                <option value="adventure">Adventure</option>
              </select>
            </label>
            <label>Food Preference
              <select id="foodStyle">
                <option value="local" selected>Local</option>
                <option value="mixed">Mixed</option>
                <option value="fine_dining">Fine Dining</option>
              </select>
            </label>
            <label>Language
              <select id="language">
                <option value="en">English</option>
                <option value="ur">Urdu</option>
              </select>
            </label>
          </div>
          <label class="budget-label">Budget (PKR): <span id="budgetValue">200000</span></label>
          <input id="budget" type="range" min="20000" max="500000" step="5000" value="200000" />
          <div class="actions">
            <button id="planBtn">Generate Plan</button>
            <button id="savePlanBtn" class="secondary">Save This Plan</button>
          </div>
          <div id="planResult" class="result"></div>
          <div id="plannerAdvice" class="result"></div>
          <div id="tripOptions" class="summary-grid"></div>
        </div>
      </section>

      <section class="page" id="page-chat">
        <div class="card chat-card">
          <h2>EcoTour AI Assistant</h2>
          <div id="chatLog" class="chat-log"></div>
          <div class="chat-input-row">
            <input id="chatInput" placeholder="Ask anything about Pakistan travel, route, safety, budget..." />
            <button id="chatBtn">Send</button>
          </div>
          <div id="chatSources" class="sources"></div>
          <div class="chat-tools">
            <button id="speakLastBtn" class="secondary">Speak Last Reply</button>
            <audio id="ttsPlayer" controls></audio>
          </div>
          <div class="chat-tools">
            <input id="voiceInput" type="file" accept="audio/*" />
            <label style="display:inline-block;margin-left:8px">Provider
              <select id="voiceProvider">
                <option value="whisper" selected>Local Whisper</option>
                <option value="openai">OpenAI Speech</option>
              </select>
            </label>
            <button id="voiceBtn" class="secondary">Transcribe Voice</button>
            <button id="recordVoiceBtn" class="secondary">Record Voice</button>
            <div id="voiceStatus" style="display:inline-flex;align-items:center;gap:8px;margin-left:12px">
              <div id="providerBadge" style="background:#eef2ff;color:#0f172a;padding:6px 8px;border-radius:999px;font-size:12px;display:none">Provider</div>
              <div id="detectedLanguage" style="color:#444">Detected: -</div>
              <div id="spinner" class="spinner hidden" aria-hidden="true"></div>
            </div>
          </div>
        </div>
      </section>

      <section class="page" id="page-saved">
        <div class="card">
          <h2>Saved Itineraries</h2>
          <div id="savedItineraries" class="stack-list"></div>
        </div>
        <div class="card">
          <h2>Trip Insights</h2>
          <div id="summaryCards" class="summary-grid"></div>
          <div id="recentTrips" class="stack-list"></div>
        </div>
      </section>

      <section class="page" id="page-crisis">
        <div class="card">
          <h2>Crisis & Emergency Help</h2>
          <textarea id="crisisInput" rows="3" placeholder="Describe emergency situation..."></textarea>
          <button id="crisisBtn">Get Crisis Advice</button>
          <div id="crisisResult" class="result"></div>
          <div id="emergencyList" class="emergency-list"></div>
        </div>
      </section>
    </main>

    <button id="assistantFab" class="assistant-fab" title="Open AI Assistant">AI</button>
    <section id="assistantWidget" class="assistant-widget hidden">
      <div class="assistant-head">
        <strong>AI Assistant</strong>
        <button id="assistantClose" class="delete-btn">X</button>
      </div>
      <div id="assistantWidgetLog" class="assistant-log"></div>
      <div class="assistant-input-row">
        <input id="assistantWidgetInput" placeholder="Ask about this screen..." />
        <button id="assistantWidgetSend">Send</button>
      </div>
    </section>

    <script src="/static/app.js"></script>
  </body>
</html>
